<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="why — paste a shell command and get a deterministic breakdown of its flags, arguments and effects, plus a plain-English explanation."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("why-theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "system";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "system";
        }
      })();
    </script>
    <style>
      html { background: #ffffff; }
      html[data-theme="dark"] { background: #0a0a0a; }
      @media (prefers-color-scheme: dark) {
        html[data-theme="system"] { background: #0a0a0a; }
      }
    </style>
    <title>why — shell command explainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
