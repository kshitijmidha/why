# Render injects $PORT automatically; fall back to 8080 for local dev.
server.port=${PORT:8080}
spring.application.name=why-explainer
# Show the exception message in error JSON (e.g. why a 400 was rejected).
server.error.include-message=always

# AI explanation layer (Groq, OpenAI-compatible). The key always comes
# from the environment, never from this file.
groq.base-url=https://api.groq.com/openai/v1
groq.model=openai/gpt-oss-20b
groq.api-key=${GROQ_API_KEY:}
groq.timeout-ms=5000
